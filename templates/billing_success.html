<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activating Arlong Pro</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#101828;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:40px;max-width:520px;text-align:center;box-shadow:0 12px 32px rgba(16,24,40,.08)}.pulse{width:14px;height:14px;background:#2563eb;border-radius:50%;margin:0 auto 20px;animation:p 1.2s infinite}@keyframes p{50%{transform:scale(1.7);opacity:.35}}h1{font-size:26px}p{color:#667085;line-height:1.6}a{display:inline-block;margin-top:14px;color:#2563eb;text-decoration:none}</style></head><body><main class="card"><div class="pulse" id="pulse"></div><h1 id="title">Activating Arlong Pro</h1><p id="message">We’re waiting for Dodo’s signed confirmation before enabling benefits.</p><a href="/dashboard">Go to dashboard</a></main><script>let attempts=0;const timer=setInterval(async()=>{attempts++;try{const r=await fetch('/api/billing/status');const d=await r.json();if(d.billing&&d.billing.status==='active'){clearInterval(timer);document.getElementById('pulse').style.background='#12b76a';document.getElementById('title').textContent='Arlong Pro is active';document.getElementById('message').textContent='Your subscription and benefits are ready.'}}catch(e){}if(attempts>=60)clearInterval(timer)},3000)</script></body></html>
