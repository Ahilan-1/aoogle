<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arlong &mdash; Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Display:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--card:#0a0a0a;--ring:rgba(255,255,255,0.145);
  --text:#fff;--text-dim:#999;--text-elev:#e7e7e7;
  --accent:#52a8ff;--success:#62c073;--error:#ef4444;
  --chip-bg:#1f1f1f;--font-head:'Inter Display',system-ui,sans-serif;
  --font-mono:'Geist Mono',monospace;
  --input-bg:rgba(255,255,255,.04);--input-border:rgba(255,255,255,.12);
}
body{background:var(--bg);color:var(--text);font-family:var(--font-head);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

.logo{font-size:24px;font-weight:600;letter-spacing:-.5px;margin-bottom:4px;text-align:center}
.sub{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:32px;text-align:center}

.auth-card{width:100%;max-width:400px}

.tabs{display:flex;gap:0;margin-bottom:28px;border:1px solid var(--ring);border-radius:0;overflow:hidden}
.tab{flex:1;padding:12px;background:transparent;border:none;color:var(--text-dim);font-family:var(--font-mono);font-size:13px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:all .15s}
.tab.active{background:var(--chip-bg);color:var(--text);font-weight:500}
.tab:hover:not(.active){color:var(--text-elev)}

.auth-form{display:none}
.auth-form.active{display:block}

.form-group{margin-bottom:16px}
.form-label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.form-input{width:100%;padding:12px 14px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:0;color:var(--text);font-family:var(--font-mono);font-size:14px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:rgba(255,255,255,.25)}

.btn-submit{width:100%;padding:13px;background:#fff;color:#111;border:none;border-radius:0;font-family:var(--font-head);font-size:15px;font-weight:500;cursor:pointer;transition:opacity .15s;margin-top:8px}
.btn-submit:hover{opacity:.85}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}

.btn-google{width:100%;padding:13px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:0;color:var(--text);font-family:var(--font-head);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .15s;margin-bottom:16px}
.btn-google:hover{border-color:var(--accent)}
.btn-google svg{width:18px;height:18px}

.or-divider{display:flex;align-items:center;gap:14px;margin:16px 0;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--ring)}

.error-msg{padding:10px 14px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.06);color:var(--error);font-family:var(--font-mono);font-size:12px;margin-bottom:16px;display:none}
.error-msg.show{display:block}

.footer-links{margin-top:28px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--text-dim)}
.footer-links a{color:var(--text-dim)}.footer-links a:hover{color:var(--text)}
</style>
</head>
<body>

<div class="logo">arlong</div>
<div class="sub">Sign in or create an account</div>

<div class="auth-card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('signin')">Sign In</button>
    <button class="tab" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <div id="error-global" class="error-msg">{{ login_error or error }}</div>

  <!-- ── SIGN IN ──────────────────────────────────────────── -->
  <div id="form-signin" class="auth-form active">
    <a href="/auth/google?redirect={{ redirect or '/ai/chat' }}" class="btn-google">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </a>
    <div class="or-divider">or</div>
    <form method="POST" action="/login" onsubmit="this.querySelector('button').disabled=true">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="redirect" value="{{ redirect or '/ai/chat' }}">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" name="username" required minlength="3" maxlength="24" autocomplete="username" placeholder="your username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" name="password" required autocomplete="current-password" placeholder="your password">
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
    <div class="footer-links">No account? <a href="#" onclick="switchTab('signup');return false">Create one</a></div>
  </div>

  <!-- ── SIGN UP ──────────────────────────────────────────── -->
  <div id="form-signup" class="auth-form">
    <a href="/auth/google?redirect={{ redirect or '/ai/chat' }}" class="btn-google">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </a>
    <div class="or-divider">or</div>
    <form method="POST" action="/signup" onsubmit="this.querySelector('button').disabled=true">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="redirect" value="{{ redirect or '/ai/chat' }}">
      <input type="hidden" name="accept_terms" value="1">
      <input type="hidden" name="security_question" value="none">
      <input type="hidden" name="security_answer" value="none">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" name="username" required minlength="3" maxlength="24" autocomplete="off" placeholder="pick a username">
      </div>
      <div class="form-group">
        <label class="form-label">Email <span style="opacity:.5">(optional)</span></label>
        <input class="form-input" type="email" name="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="8+ characters">
      </div>
      <button type="submit" class="btn-submit">Create Account</button>
    </form>
    <div class="footer-links">Have an account? <a href="#" onclick="switchTab('signin');return false">Sign in</a></div>
  </div>
</div>

<script>
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.auth-form').forEach(function(f){f.classList.remove('active')});
  if(tab==='signin'){
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('form-signin').classList.add('active');
  }else{
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('form-signup').classList.add('active');
  }
}
{% if initial_mode == 'signup' %}
switchTab('signup');
{% elif login_error or error %}
switchTab('signin');
{% endif %}
{% if login_error or error %}
document.getElementById('error-global').classList.add('show');
{% endif %}
</script>
</body>
</html>
