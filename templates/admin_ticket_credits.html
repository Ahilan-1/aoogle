<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Grant credits · Arlong</title><style>body{margin:0;background:#090d14;color:#e7ebf2;font:14px Arial}main{max-width:620px;margin:60px auto;background:#111720;border:1px solid #283344;padding:28px}a{color:#75a7f3}label{display:grid;gap:6px;margin:16px 0;color:#8e9aab}input{background:#0c121b;border:1px solid #283344;color:white;padding:11px}button{background:#4e7fd2;border:0;color:white;padding:11px 15px}.balance{border:1px solid #283344;padding:14px}</style></head><body><main><a href="/admin/tickets?ticket={{ticket.id}}">← Back to ticket</a><h1>Credit compensation</h1><p>{{ticket.requester_name}} · {{ticket.id}}</p><div class="balance">Current prepaid balance: <b>{{wallet.balance}} credits</b></div><form method="post"><input type="hidden" name="_csrf_token" value="{{csrf_token()}}"><label>Credits (maximum 90)<input name="credits" type="number" min="1" max="90" required></label><label>Reason<input name="reason" minlength="5" maxlength="240" required></label><button>Grant and notify customer</button></form><p>Every grant is recorded in the ledger and posted as a public ticket reply.</p></main></body></html>
