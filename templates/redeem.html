<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Redeem - arlong</title>
    <style>
        :root{--bg:#000;--bg2:#0d0d0d;--card:#1a1a1a;--text:#e8eaed;--text2:#bdc1c6;--text3:#8a8f96;--link:#8ab4f8;--border:#333;--green:#30d158;--gold:#fbbc04}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden}
        .logo{font-size:32px;font-family:'Product Sans',Arial,sans-serif;letter-spacing:-1px;margin-bottom:4px;position:fixed;top:24px;left:50%;transform:translateX(-50%)}
        .logo span{background:linear-gradient(to top,#0066cc,#3399ff 50%,var(--text) 50%);background-size:100% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:arlong-wave 4s ease-in-out infinite}
        .logo span:nth-child(1){animation-delay:0s}
        .logo span:nth-child(2){animation-delay:.15s}
        .logo span:nth-child(3){animation-delay:.3s}
        .logo span:nth-child(4){animation-delay:.45s}
        .logo span:nth-child(5){animation-delay:.6s}
        .logo span:nth-child(6){animation-delay:.75s}
        @keyframes arlong-wave{0%,100%{background-position:0 45%}50%{background-position:0 55%}}

        .redeem-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:440px;text-align:center;position:relative}
        .redeem-box h1{font-size:24px;font-weight:600;margin-bottom:6px}
        .redeem-box p{color:var(--text3);font-size:14px;margin-bottom:24px;line-height:1.5}
        .key-input{width:100%;padding:14px 18px;border:1px solid var(--border);border-radius:12px;font-size:16px;font-family:monospace;letter-spacing:2px;text-transform:uppercase;background:var(--bg2);color:var(--text);outline:none;transition:border-color .2s;text-align:center}
        .key-input:focus{border-color:var(--link)}
        .key-input::placeholder{letter-spacing:0;text-transform:none;color:var(--text3);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
        .redeem-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;background:var(--link);color:#fff;margin-top:16px;transition:opacity .2s}
        .redeem-btn:hover{opacity:.9}
        .redeem-btn:disabled{opacity:.5;cursor:default}
        .error-msg{color:#ff453a;font-size:13px;margin-top:12px;display:none}
        .back-link{margin-top:20px;font-size:13px;color:var(--text3)}
        .back-link a{color:var(--link);text-decoration:none}
        .back-link a:hover{text-decoration:underline}

        .success-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
        .success-overlay.show{display:flex}
        .checkmark-circle{width:96px;height:96px;border-radius:50%;background:rgba(48,209,88,.15);display:flex;align-items:center;justify-content:center;margin-bottom:32px;opacity:0;transform:scale(0.5)}
        .success-overlay.show .checkmark-circle{animation:pop-in .5s cubic-bezier(.175,.885,.32,1.275) forwards}
        .checkmark-circle svg{width:48px;height:48px}
        .checkmark-circle .check-bg{fill:none}
        .checkmark-circle .check-path{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
        .success-overlay.show .checkmark-circle .check-path{animation:draw-check .6s .3s ease forwards}
        @keyframes pop-in{to{opacity:1;transform:scale(1)}}
        @keyframes draw-check{to{stroke-dashoffset:0}}

        .hello-text{font-size:64px;font-weight:700;color:var(--text);opacity:0;transform:translateY(20px) scale(0.9);letter-spacing:-2px}
        .success-overlay.show .hello-text{animation:hello-appear .8s .6s cubic-bezier(.175,.885,.32,1.275) forwards}
        @keyframes hello-appear{to{opacity:1;transform:translateY(0) scale(1)}}

        .plan-badge{font-size:18px;font-weight:500;color:var(--text2);margin-top:8px;opacity:0;transform:translateY(10px)}
        .success-overlay.show .plan-badge{animation:fade-up .6s .9s ease forwards}
        .plan-badge .tier-name{color:var(--gold);font-weight:700}
        @keyframes fade-up{to{opacity:1;transform:translateY(0)}}

        .confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;overflow:hidden}
        .confetti{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0}
        .success-overlay.show~.confetti-container .confetti{animation:confetti-fall 2.5s .8s ease forwards}
        @keyframes confetti-fall{
            0%{opacity:1;transform:translateY(-10px) rotate(0deg) scale(0)}
            20%{opacity:1;transform:translateY(20vh) rotate(180deg) scale(1)}
            100%{opacity:0;transform:translateY(100vh) rotate(720deg) scale(0.5)}
        }

        .sub-text{font-size:14px;color:var(--text3);margin-top:16px;opacity:0}
        .success-overlay.show .sub-text{animation:fade-up .6s 1.1s ease forwards}

        @media(max-width:480px){
            .redeem-box{padding:28px 20px;border-radius:16px}
            .redeem-box h1{font-size:20px}
            .hello-text{font-size:44px}
            .checkmark-circle{width:72px;height:72px}
            .checkmark-circle svg{width:36px;height:36px}
        }
    </style>
</head>
<body>
    <div class="logo"><span>a</span><span>r</span><span>l</span><span>o</span><span>n</span><span>g</span></div>

    <div class="redeem-box" id="redeem-box">
        <h1>Redeem your key</h1>
        <p>Enter your product key below to activate your arlong membership.</p>
        <input type="text" class="key-input" id="key-input" placeholder="ARLONG-XXXXXXXX" autocomplete="off" autofocus>
        <button class="redeem-btn" id="redeem-btn" onclick="redeemKey()">Redeem</button>
        <div class="error-msg" id="error-msg"></div>
        <div class="back-link"><a href="/">Back to search</a></div>
    </div>

    <div class="success-overlay" id="success-overlay">
        <div class="checkmark-circle">
            <svg viewBox="0 0 48 48">
                <circle class="check-bg" cx="24" cy="24" r="22"/>
                <path class="check-path" d="M14 24l7 7 13-13"/>
            </svg>
        </div>
        <div class="hello-text">Hello</div>
        <div class="plan-badge">Welcome to <span class="tier-name" id="tier-name">arlong</span></div>
        <div class="sub-text">Your membership is now active. Start searching!</div>
    </div>

    <div class="confetti-container" id="confetti-container"></div>

    <script>
        var keyInput = document.getElementById('key-input');
        keyInput.addEventListener('input', function(){
            var val = this.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
            if(val.length > 15) val = val.slice(0, 15);
            this.value = val;
        });
        keyInput.addEventListener('keydown', function(e){
            if(e.key === 'Enter') redeemKey();
        });

        keyInput.addEventListener('paste', function(e){
            e.preventDefault();
            var paste = (e.clipboardData || window.clipboardData).getData('text');
            var clean = paste.toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 15);
            this.value = clean;
        });

        function showError(msg){
            var el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(function(){ el.style.display = 'none'; }, 4000);
        }

        async function redeemKey(){
            var key = keyInput.value.trim();
            if(!key || key.length < 14){
                showError('Please enter a valid product key (ARLONG-XXXXXXXX).');
                return;
            }
            var btn = document.getElementById('redeem-btn');
            btn.disabled = true;
            btn.textContent = 'Redeeming...';
            try {
                var resp = await fetch('/api/redeem-key', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key: key})
                });
                var data = await resp.json();
                if(data.ok){
                    document.getElementById('tier-name').textContent = data.tier_name;
                    document.getElementById('redeem-box').style.display = 'none';
                    var overlay = document.getElementById('success-overlay');
                    overlay.classList.add('show');
                    spawnConfetti();
                    setTimeout(function(){ window.location.href = '/'; }, 5000);
                } else {
                    showError(data.error || 'Invalid key.');
                    btn.disabled = false;
                    btn.textContent = 'Redeem';
                }
            } catch(err){
                showError('Network error. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Redeem';
            }
        }

        function spawnConfetti(){
            var container = document.getElementById('confetti-container');
            var colors = ['#30d158','#fbbc04','#ff453a','#5e5ce6','#64d2ff','#ff9f0a','#bf5af2'];
            for(var i=0;i<60;i++){
                var el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.background = colors[Math.floor(Math.random()*colors.length)];
                el.style.width = (Math.random()*6+4) + 'px';
                el.style.height = (Math.random()*6+4) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.animationDelay = (Math.random()*1.5 + 0.3) + 's';
                el.style.animationDuration = (Math.random()*1.5 + 2) + 's';
                container.appendChild(el);
            }
        }
    </script>
</body>
</html>
